name: J.A.R.V.I.S. · Iron Man HUD

# Rebuilds the README artwork in assets/ironman/ and refreshes the live
# diagnostics + targeting cards from the GitHub API.
on:
  schedule:
    - cron: "30 1 * * *" # every day at 01:30 UTC
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "ironman/**"
      - ".github/workflows/ironman-hud.yml"

permissions:
  contents: write

concurrency:
  group: ironman-hud
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build HUD artwork + live telemetry
        run: node ironman/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ironman
          if git diff --cached --quiet; then
            echo "HUD already up to date."
            exit 0
          fi
          git commit -m "chore(hud): J.A.R.V.I.S. telemetry refresh"
          git pull --rebase origin main
          git push origin HEAD:main
